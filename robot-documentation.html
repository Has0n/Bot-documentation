<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AskUS video Documentation</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:     #0A0E1A;
      --panel:    #111827;
      --cyan:     #B729FF;
      --cyan-dim: #5C04D6;
      --plat:     #5C04D6;
      --white:    #F0F4F8;
      --muted:    #5A6A7A;
      --red:      #FF4C6A;
      --yellow:   #FFD24C;
      --green:    #00FF88;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--navy);
      color: var(--plat);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      padding: 52px 24px 80px;
    }

    /* PAGE TITLE */
    .page-title {
      text-align: center;
      margin-bottom: 52px;
    }

    .page-title .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .page-title h1 {
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.02em;
    }

    .page-title h1 span { color: var(--cyan); }

    /* GRID */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
      gap: 28px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* HUD PANEL */
    .hud-panel {
      background: var(--panel);
      border: 1px solid rgba(0,212,255,0.22);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 32px rgba(0,212,255,0.07), inset 0 0 40px rgba(0,0,0,0.3);
      position: relative;
      transition: box-shadow 0.25s, border-color 0.25s;
    }

    .hud-panel:hover {
      border-color: rgba(0,212,255,0.5);
      box-shadow: 0 0 48px rgba(0,212,255,0.15);
    }

    /* corner brackets */
    .hud-panel::before,
    .hud-panel::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      border-color: var(--cyan);
      border-style: solid;
      z-index: 2;
      pointer-events: none;
    }
    .hud-panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .hud-panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    /* TOP BAR */
    .hud-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0,212,255,0.05);
      border-bottom: 1px solid rgba(0,212,255,0.12);
    }

    .hud-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--cyan);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hud-controls { display: flex; gap: 6px; }
    .hud-dot { width: 8px; height: 8px; border-radius: 50%; }
    .hud-dot-r { background: var(--red); }
    .hud-dot-y { background: var(--yellow); }
    .hud-dot-g { background: var(--green); }

    /* VIDEO */
    .video-wrapper {
      position: relative;
      padding-top: 56.25%;
      background: #05080F;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    

    /* CAPTION */
    .video-caption {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      padding: 0 2px;
    }
    .video-caption strong { color: var(--plat); font-weight: 500; }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--navy); }
    ::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 3px; }

    @media (max-width: 520px) {
      .video-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hud-panel { transition: none; }
    }
  </style>
</head>
<body>

  <div class="page-title">
    <div class="eyebrow">4 mode robot project</div>
    <h1>Robot <span>Overview</span></h1>
  </div>

  <div class="video-grid">

    <!-- VIDEO 1 -->
    <div>
      <div class="hud-panel">
        <div class="hud-topbar">
          <span class="hud-title">▶ Full Overview Runthrough </span>
          <div class="hud-controls">
            <div class="hud-dot hud-dot-r"></div>
            <div class="hud-dot hud-dot-y"></div>
            <div class="hud-dot hud-dot-g"></div>
          </div>
        </div>
        <div class="video-wrapper">
		  <video controls width="100%" title="AutoMode">
		  <source src="fulloverview.mov" type="video/mp4">
		</video>

        </div>

    <!-- VIDEO 2 -->
    <div>
      <div class="hud-panel">
        <div class="hud-topbar">
          <span class="hud-title">▶ SumoBot mode</span>
          <div class="hud-controls">
            <div class="hud-dot hud-dot-r"></div>
            <div class="hud-dot hud-dot-y"></div>
            <div class="hud-dot hud-dot-g"></div>
          </div>
        </div>
        <div class="video-wrapper">
  		  <video controls width="100%" title="AutoMode">
		  <source src="SumoBot.mov" type="video/mp4">
		</video>
        </div>
    <!-- VIDEO 3 -->
    <div>
      <div class="hud-panel">
        <div class="hud-topbar">
          <span class="hud-title">▶ HockeyBot Mode</span>
          <div class="hud-controls">
            <div class="hud-dot hud-dot-r"></div>
            <div class="hud-dot hud-dot-y"></div>
            <div class="hud-dot hud-dot-g"></div>
          </div>
        </div>
        <div class="video-wrapper">
          		  <video controls width="100%" title="AutoMode">
		  <source src="HockeyBot.mov" type="video/mp4">
		</video>
        </div>
        
    <!-- VIDEO 4 -->
    <div>
      <div class="hud-panel">
        <div class="hud-topbar">
          <span class="hud-title">▶ Maze Solver Mode</span>
          <div class="hud-controls">
            <div class="hud-dot hud-dot-r"></div>
            <div class="hud-dot hud-dot-y"></div>
            <div class="hud-dot hud-dot-g"></div>
          </div>
        </div>
        <div class="video-wrapper">
         		  <video controls width="100%" title="AutoMode">
		  <source src="MazeSolver.mov" type="video/mp4">
		</video>
        </div>
       
    <!-- VIDEO 5 -->
    <div>
      <div class="hud-panel">
        <div class="hud-topbar">
          <span class="hud-title">▶ AutoBot Mode</span>
          <div class="hud-controls">
            <div class="hud-dot hud-dot-r"></div>
            <div class="hud-dot hud-dot-y"></div>
            <div class="hud-dot hud-dot-g"></div>
          </div>
        </div>
        <div class="video-wrapper">
          		  <video controls width="100%" title="AutoMode">
		  <source src="AutoMode.mov" type="video/mp4">
		</video>
        </div>
        

  </div>

</body>
</html>
